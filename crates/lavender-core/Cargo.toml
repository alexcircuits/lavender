[package]
name = "lavender-core"
description = "Lavender's transport-independent application core: provider adapters, egress policy, feed hub, registry, health, search and the LavenderCore facade. Used by lavender-server (HTTP) and the Tauri desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
fastrand.workspace = true
futures.workspace = true
grib.workspace = true
jiff.workspace = true
keyring = { workspace = true, optional = true }
lavender-domain.workspace = true
lavender-geo.workspace = true
moka.workspace = true
prost.workspace = true
quick-xml.workspace = true
regex.workspace = true
reqwest.workspace = true
rstar.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
criterion.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
wiremock.workspace = true

# Criterion drives the loop; `cargo bench -p lavender-core` (ENG-1000).
[[bench]]
name = "normalise"
harness = false

[[bench]]
name = "snapshot"
harness = false

[features]
default = []
keyring = ["dep:keyring"]

[lints]
workspace = true

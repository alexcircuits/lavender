[package]
name = "lavender-geo"
description = "Pure geospatial computation for Lavender: geodesy, bbox/region keys, coordinate parsing (decimal, DMS, MGRS), SGP4 propagation and spatial indexing. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
jiff.workspace = true
lavender-domain.workspace = true
rstar.workspace = true
sgp4.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

# Criterion drives the loop; `cargo bench -p lavender-geo` (ENG-1000).
[[bench]]
name = "geo"
harness = false

[lints]
workspace = true

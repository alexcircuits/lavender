# Lavender Rust workspace. Template: products/kvbnews/backend (monorepo Rust conventions).
# Direct dependencies use exact pins; review upgrades and lockfile changes (owner decision 2026-10-12).
[workspace]
resolver = "3"
# The desktop app is a member (shared lockfile) but not a default member: plain `cargo`
# commands and server CI never compile Tauri or need WebKitGTK.
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
lavender-domain = { path = "crates/lavender-domain" }
lavender-geo = { path = "crates/lavender-geo" }
lavender-core = { path = "crates/lavender-core" }

async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws", "matched-path", "original-uri", "tracing"] }
bytes = "=1.12.1"
csv = "=1.4.0"
fastrand = "=2.5.0"
futures = "=0.3.34"
grib = { version = "=0.19.1", default-features = false, features = ["ccsds-unpack-with-rust-aec"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
jiff = { version = "=0.2.38", features = ["serde"] }
keyring = "=4.2.0"
moka = { version = "=0.12.16", features = ["future"] }
prost = "=0.14.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "gzip", "json", "stream", "http2"] }
rstar = "=0.13.0"
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sgp4 = "=2.4.0"
tauri = { version = "=2.12.3", features = [] }
tauri-build = { version = "=2.7.2", features = [] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = "=0.7.20"
toml = "=1.1.8"
tower = { version = "=0.5.3", features = ["util", "timeout", "limit"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace", "timeout", "limit", "set-header", "request-id", "catch-panic", "compression-gzip", "util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json", "fmt"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat", "jiff-impl", "serde-json-impl", "no-serde-warnings"] }
url = "=2.5.8"

# Tests only
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "=1.12.0"
quick-xml = "=0.42.0"
regex = "=1.13.1"
# Throwaway TLS certificates for the AISStream wss:// tests, generated in memory per run.
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tempfile = "=3.27.0"
# A local TLS server for the AISStream wss:// test (already in the graph via reqwest).
tokio-rustls = { version = "=0.26.6", default-features = false }
wiremock = "=0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# unwrap, expect and panic are denied in library and binary code; clippy.toml allows them in
# tests. -D warnings in CI turns the pedantic group into errors too.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
